name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# configure-pages needs pages:write to turn Pages on; deploy-pages needs id-token
# for the deployment's OIDC exchange.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement:true switches Pages on for the repo on the first run,
      # so this does not have to be done by hand in Settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Publish only the page and its assets — not the README, the workflow
      # or the git metadata.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
